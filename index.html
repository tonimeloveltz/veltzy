<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#042f1f" />

    <title>Veltzy - CRM com IA para vendas via WhatsApp</title>
    <meta name="description" content="CRM multi-tenant com IA SDR, pipeline drag & drop e atendimento multicanal via WhatsApp, Instagram e LinkedIn" />

    <meta property="og:title" content="Veltzy" />
    <meta property="og:description" content="CRM com IA para vendas via WhatsApp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.veltzy.com.br" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      // Aplica tema E cor da marca ANTES do React montar (evita flash de cor errada,
      // ex: spinner verde piscando antes da cor da empresa carregar).
      (function() {
        var root = document.documentElement;
        var theme = localStorage.getItem('veltzy-theme') || 'dark';
        if (theme !== 'light') root.classList.add(theme);

        var primary = localStorage.getItem('veltzy-primary');
        var m = primary && primary.match(/(\d+)\s+(\d+)%?\s+(\d+)%?/);
        if (m) {
          var h = +m[1], s = +m[2], l = +m[3];
          var isDark = theme === 'dark';
          var p = (isDark && l < 20) ? (h + ' ' + s + '% 55%') : primary;
          ['--primary', '--ring', '--sidebar-primary', '--glow-primary'].forEach(function(v) {
            root.style.setProperty(v, p);
          });
          if (theme !== 'sand') {
            root.style.setProperty('--accent', isDark ? (h + ' ' + Math.round(s * 0.1) + '% 16%') : (h + ' ' + Math.round(s * 0.6) + '% 94%'));
          }
          // Fora do guard de propósito: o sand mantém o fundo de areia, mas a cor
          // do texto no hover segue a marca igual aos outros temas.
          root.style.setProperty('--accent-foreground', isDark ? (h + ' ' + s + '% 58%') : (h + ' ' + s + '% 32%'));
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
